# GPU Buddy, Mac App Store edition: sandboxed, compiled with APPSTORE, no bundled gpud.
# Same bundle ID as the iPhone/iPad app (com.miulabs.gpubuddy) so it is one listing with universal purchase.
# Generate with: xcodegen generate --spec app/appstore/project.yml   (scripts/appstore-*.sh do this for you)
name: GPUBuddyMac
options:
  deploymentTarget: { macOS: "14.0" }
settings:
  base:
    DEVELOPMENT_TEAM: XC9C9QZ6W8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.14.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  GPUBuddy:
    type: application
    platform: macOS
    sources:
      - path: ../GPUBuddy.swift
      - path: ../mac/Router.swift
      - path: GPUBuddyStoreApp.swift
      - path: NativeFeed.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: GPU Buddy
        EXECUTABLE_NAME: GPUBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.miulabs.gpubuddy
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GPUBuddy-AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        COMBINE_HIDPI_IMAGES: YES
